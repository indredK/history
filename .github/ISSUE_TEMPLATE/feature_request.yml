name: ✨ 功能建议
description: 提出新功能或改进现有功能
title: "[Feature] "
labels: ["enhancement", "needs-discussion"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你的建议!**提交前请先在 Discussions 讨论一下方向**,避免方向跑偏。

  - type: textarea
    id: problem
    attributes:
      label: 当前的痛点 / 需求场景
      description: 描述这个功能要解决什么实际问题
      placeholder: 例如"想看某朝代和邻接朝代的疆域对比,但目前只能逐个切换"
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 建议的方案
      description: 你希望这个功能如何工作?
      placeholder: 增加一个"对比模式",可以同时显示两个朝代的地图叠加
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 你考虑过的替代方案
      description: 有没有其他思路?为什么没选?

  - type: dropdown
    id: scope
    attributes:
      label: 影响范围
      options:
        - 前端 (frontend)
        - 后端 (backend)
        - 数据 (data)
        - 文档 (docs)
        - 其他
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: 你认为的优先级
      options:
        - 低(锦上添花)
        - 中(明显改善体验)
        - 高(核心场景受阻)

  - type: checkboxes
    id: willingness
    attributes:
      label: 你愿意贡献吗?
      options:
        - label: 我愿意提交 PR 实现这个功能
        - label: 我愿意参与讨论但不写代码
        - label: 我只是提建议
