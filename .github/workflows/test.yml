name: Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

# 同一分支 / 同一 PR 新提交时取消上一次未完成的 run
concurrency:
  group: test-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (test + type-check)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5

      - name: Install dependencies
        run: cd frontend && bun install

      - name: Run tests
        run: cd frontend && bun run test

      - name: Run type check
        run: cd frontend && bun run type-check

  backend:
    name: Backend (test + type-check)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5

      - name: Install dependencies
        run: cd backend && bun install

      - name: Run tests
        run: cd backend && bun run test

      - name: Run type check
        run: cd backend && bun run type-check

  # NOTE: lint 暂未接入 CI。前后端各有历史警告/错误超出阈值:
  # - frontend: 116 个 no-explicit-any 警告(阈值 100)
  # - backend:  130 个 no-unsafe-* / no-unused-vars 错误,集中在
  #             transformFigure / parseJson / safeJsonParse 等 helper
  # 清理完成后追加 lint job。
